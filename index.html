<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPWA - IPTV / VOD</title>
    <!-- Tailwind CSS para design moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f1014">
</head>
<body class="bg-[#0f1014] text-white min-h-screen flex flex-col font-sans">

    <!-- Header / Navbar -->
    <header class="flex items-center justify-between px-6 py-4 bg-[#141414]/80 backdrop-blur-md sticky top-0 z-50 border-b border-zinc-800">
        <h1 class="text-xl font-bold tracking-wider text-red-600">STREAM<span class="text-white">PWA</span></h1>
        <div class="flex gap-4 text-sm text-zinc-400">
            <button onclick="filterCategory('all')" class="hover:text-white transition">Início</button>
            <button onclick="filterCategory('movie')" class="hover:text-white transition">Filmes</button>
            <button onclick="filterCategory('series')" class="hover:text-white transition">Séries</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-6 max-w-7xl mx-auto w-full">
        
        <!-- Destaque / Hero Banner (Exemplo Filme ID 550 - Fight Club) -->
        <section class="relative rounded-2xl overflow-hidden bg-zinc-900 border border-zinc-800 mb-8 p-8 flex flex-col justify-end min-h-[300px]">
            <div class="absolute inset-0 bg-gradient-to-t from-[#0f1014] via-transparent to-transparent z-10"></div>
            <div class="relative z-20 max-w-xl">
                <span class="bg-red-600 text-xs font-semibold px-2.5 py-1 rounded-md uppercase">Destaque</span>
                <h2 class="text-3xl font-bold mt-2">Clube da Luta (Filme)</h2>
                <p class="text-zinc-400 text-sm mt-1 mb-4">Um homem deprimido que sofre de insônia conhece um vendedor misterioso...</p>
                <button onclick="openPlayer(550, null, null, 'Clube da Luta')" class="bg-white text-black font-semibold px-6 py-2.5 rounded-lg flex items-center gap-2 hover:bg-zinc-200 transition">
                    ▶ Assistir Agora
                </button>
            </div>
        </section>

        <!-- Grade de Conteúdos (Catálogo Exemplo) -->
        <h3 class="text-lg font-semibold mb-4">Catálogo Disponível</h3>
        <div id="media-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <!-- Os cards serão injetados via JavaScript -->
        </div>
    </main>

    <!-- Modal do Player (Iframe do frameXTV) -->
    <div id="player-modal" class="fixed inset-0 bg-black/90 backdrop-blur-lg z-50 hidden flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-4xl bg-zinc-900 rounded-2xl overflow-hidden border border-zinc-800 shadow-2xl flex flex-col">
            <div class="flex justify-between items-center p-4 bg-zinc-950 border-b border-zinc-800">
                <h3 id="modal-title" class="font-semibold text-sm">Reproduzindo</h3>
                <button onclick="closePlayer()" class="text-zinc-400 hover:text-white text-lg font-bold px-2">✕</button>
            </div>
            <!-- Container do Iframe baseada na documentação fornecida -->
            <div class="relative w-full aspect-video bg-black">
                <iframe id="video-iframe" class="w-full h-full border-0" allowfullscreen title="frameXTV Stream Player"></iframe>
            </div>
        </div>
    </div>

    <!-- Script de lógica -->
    <script src="app.js"></script>
</body>
</html>
