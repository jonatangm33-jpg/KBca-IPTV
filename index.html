<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Leitor IPTV</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{--bg:#0b0b0f;--bg2:#121218;--card:#17171f;--text:#f5f5f7;--muted:#9aa0aa;--ac:#e50914;--ac2:#ff2d55}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 20px 12px;background:rgba(11,11,15,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.logo{font-weight:900;font-size:22px;letter-spacing:-1px;color:var(--ac);white-space:nowrap}.logo span{color:#fff}
.search{flex:1;max-width:420px;margin-left:auto}
.search input{width:100%;padding:10px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.07);color:#fff;font-size:15px;outline:0}
.search input:focus{border-color:var(--ac)}
.plus{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));font-size:22px;font-weight:700;flex:none}
.bar{display:flex;gap:8px;overflow-x:auto;padding:6px 20px;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.bar button{flex:none;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--muted);font-size:14px;font-weight:600;white-space:nowrap}
.bar button.on{background:#fff;color:#000}
#chips button{font-size:13px;padding:6px 12px}
#chips button.on{background:var(--ac);color:#fff}
#info{padding:8px 20px;color:var(--muted);font-size:13px;min-height:30px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;padding:6px 20px 20px}
.card{position:relative;aspect-ratio:2/3;border-radius:14px;background:var(--card);overflow:hidden;cursor:pointer;transition:transform .15s}
.card:hover,.card:focus-visible{transform:scale(1.04)}
.card::before{content:attr(data-l);position:absolute;inset:0;display:grid;place-items:center;font-size:56px;font-weight:900;color:#2c2c37}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:10px 10px 56px}
.card::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.92));pointer-events:none}
.meta{position:absolute;left:0;right:0;bottom:0;padding:10px;z-index:2;font-size:13px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fav{position:absolute;top:8px;right:8px;z-index:3;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.6);font-size:16px}
.more{display:block;margin:0 auto 60px;padding:12px 28px;border-radius:12px;background:rgba(255,255,255,.1);font-weight:700}
.empty{padding:80px 24px;text-align:center;color:var(--muted)}.empty h3{color:#fff;font-size:22px;margin:0 0 8px}
.btn{padding:12px 20px;border-radius:10px;font-weight:700;background:rgba(255,255,255,.1)}
.btn.ok{background:var(--ac);color:#fff}.btn:disabled{opacity:.5}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.9)}
.modal.open{display:flex}
.box{width:min(520px,100%);max-height:94vh;overflow-y:auto;background:var(--bg2);border-radius:20px;padding:24px;border:1px solid rgba(255,255,255,.08)}
.box h2{margin:0 0 4px}.box .sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.box label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.box input,.box textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#fff;font-size:14px;font-family:inherit}
.box textarea{min-height:90px}
.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
#prog{margin-top:12px;font-size:13px;color:var(--muted);min-height:18px}
.pbox{width:min(1100px,100%);background:#000;border-radius:16px;overflow:hidden}
.pbox video{width:100%;max-height:72vh;background:#000;display:block}
.ptop{display:flex;align-items:center;gap:12px;padding:12px 16px}
.ptop b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pe{padding:0 16px;color:#ffb3b8;font-size:13px;min-height:18px}
.pact{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px 16px}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,120px);background:var(--ac);color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;font-size:14px;z-index:300;transition:transform .3s;max-width:92%;text-align:center}
.toast.show{transform:translate(-50%,0)}
@media(max-width:600px){header{padding-left:14px;padding-right:14px}.bar,#grid,#info{padding-left:14px;padding-right:14px}#grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo">Leitor<span>IPTV</span></div>
  <div class="search"><input id="q" type="search" placeholder="Pesquisar em toda a lista…" autocomplete="off"></div>
  <button class="plus" id="bImp" aria-label="Importar lista">+</button>
</header>
<nav class="bar" id="tabs"></nav>
<nav class="bar" id="chips"></nav>
<div id="info"></div>
<main>
  <div id="grid"></div>
  <button class="more" id="more" style="display:none">Mostrar mais</button>
  <div class="empty" id="empty" style="display:none">
    <h3>Ainda não há lista</h3>
    <p>Importa um ficheiro M3U, um URL ou cola o conteúdo.</p>
    <button class="btn ok" id="bImp2">Importar lista</button>
  </div>
</main>

<div class="modal" id="imp"><div class="box">
  <h2>Importar lista M3U</h2>
  <p class="sub">Para listas grandes, usa o ficheiro: é o método mais fiável.</p>
  <label for="f">Ficheiro (.m3u, .m3u8, .txt)</label>
  <input id="f" type="file">
  <label for="u">Ou URL da lista</label>
  <input id="u" type="url" placeholder="https://exemplo.com/lista.m3u">
  <label for="t">Ou cola o conteúdo</label>
  <textarea id="t" placeholder="#EXTM3U"></textarea>
  <div id="prog"></div>
  <div class="acts">
    <button class="btn" id="bClear">Apagar lista</button>
    <button class="btn" id="bCancel">Fechar</button>
    <button class="btn ok" id="bGo">Importar</button>
  </div>
</div></div>

<div class="modal" id="player"><div class="pbox">
  <div class="ptop"><b id="pt"></b><button class="btn" id="bClose">Fechar ✕</button></div>
  <video id="v" controls playsinline autoplay></video>
  <div id="pe"></div>
  <div class="pact">
    <button class="btn" id="bVlc">Abrir no VLC</button>
    <button class="btn" id="bCopy">Copiar link</button>
    <button class="btn" id="bOpen">Abrir link</button>
  </div>
</div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const PAGE=48;
const S={secs:new Map(),sec:null,sub:null,items:[],shown:0,favs:[],sid:0};

/* ---------- IndexedDB (a lista grande não cabe no localStorage) ---------- */
let _db;
function idb(){
  return _db||(_db=new Promise((ok,ko)=>{
    const r=indexedDB.open('leitor-iptv',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error);
  }));
}
const txDone=tx=>new Promise((ok,ko)=>{tx.oncomplete=ok;tx.onerror=tx.onabort=()=>ko(tx.error)});
async function kvGet(k){
  const db=await idb();
  return new Promise((ok,ko)=>{const r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
}

/* ---------- Parser M3U incremental (linha a linha, sem split gigante) ---------- */
class Parser{
  constructor(){this.cur=null;this.groups=new Map();this.total=0;this.rest=''}
  push(chunk,final){
    const s=this.rest+chunk;let a=0,i;
    while((i=s.indexOf('\n',a))>-1){this.line(s.slice(a,i));a=i+1}
    this.rest=s.slice(a);
    if(final&&this.rest){this.line(this.rest);this.rest=''}
  }
  line(raw){
    const l=raw.trim();if(!l)return;
    if(l.charCodeAt(0)===35){
      if(l.startsWith('#EXTINF')){
        const lg=/tvg-logo\s*=\s*["']([^"']*)["']/i.exec(l);
        const gr=/group-title\s*=\s*["']([^"']*)["']/i.exec(l);
        let nm=l.slice(l.lastIndexOf(',')+1).trim();
        if(!nm){const m=/tvg-name\s*=\s*["']([^"']*)["']/i.exec(l);nm=m?m[1]:''}
        this.cur={n:nm||'Sem nome',l:lg?lg[1]:'',g:gr?gr[1].trim():''};
      }else if(l.startsWith('#EXTGRP:')&&this.cur&&!this.cur.g){this.cur.g=l.slice(8).trim()}
    }else if(this.cur){
      const c=this.cur;this.cur=null;
      if(!/^[a-z]+:\/\//i.test(l))return;
      const g=c.g||'Sem grupo';
      let arr=this.groups.get(g);if(!arr){arr=[];this.groups.set(g,arr)}
      arr.push([c.n,c.l,l]);this.total++;
    }
  }
}
function entry(g,arr){
  const k=g.indexOf('|');
  return{g,sec:(k>-1?g.slice(0,k):g).trim()||'Outros',sub:k>-1?g.slice(k+1).trim():'Tudo',c:arr.length};
}
async function save(p){
  const db=await idb(),tx=db.transaction('kv','readwrite'),st=tx.objectStore('kv');
  st.clear();const index=[];
  for(const[g,arr]of p.groups){st.put(arr,'g:'+g);index.push(entry(g,arr))}
  st.put(index,'index');
  await txDone(tx);
}

/* ---------- Leitura em stream (ficheiro ou rede) ---------- */
async function feed(body,size,p,label){
  if(!body||!body.getReader){const t=await new Response(body).text();p.push(t,true);return}
  const rd=body.getReader(),dec=new TextDecoder('utf-8');let got=0;
  for(;;){
    const{done,value}=await rd.read();if(done)break;
    got+=value.length;p.push(dec.decode(value,{stream:true}),false);
    $('prog').textContent=`${label} ${(got/1048576).toFixed(1)} MB${size?' de '+(size/1048576).toFixed(1):''} · ${p.total.toLocaleString('pt-PT')} itens`;
  }
  p.push(dec.decode(),true);
}
async function fetchUrl(url){
  const enc=encodeURIComponent(url);
  const targets=[url,'https://corsproxy.io/?url='+enc,'https://api.allorigins.win/raw?url='+enc,'https://api.codetabs.com/v1/proxy/?quest='+enc];
  for(const t of targets){
    const p=new Parser(),ac=new AbortController(),to=setTimeout(()=>ac.abort(),30000);
    try{
      $('prog').textContent='A ligar…';
      const r=await fetch(t,{signal:ac.signal});clearTimeout(to);
      if(!r.ok)continue;
      await feed(r.body,+r.headers.get('content-length')||0,p,'A descarregar');
      if(p.total)return p;
    }catch(e){clearTimeout(to)}
  }
  throw new Error('Não foi possível ler o URL (bloqueio CORS ou rede). Descarrega o ficheiro e usa «Ficheiro».');
}
async function doImport(){
  const url=$('u').value.trim(),f=$('f').files[0],t=$('t').value.trim();
  if(!url&&!f&&!t)return toast('Escolhe um ficheiro, URL ou cola o conteúdo');
  $('bGo').disabled=true;
  try{
    let p;
    if(f){p=new Parser();await feed(f.stream(),f.size,p,'A ler')}
    else if(t){p=new Parser();p.push(t,true)}
    else p=await fetchUrl(url);
    if(!p.total)throw new Error('Lista vazia ou formato não reconhecido');
    $('prog').textContent='A guardar no dispositivo…';
    await save(p);
    await loadIndex();
    $('imp').classList.remove('open');
    toast(`✅ ${p.total.toLocaleString('pt-PT')} itens importados`);
  }catch(e){toast(e.message||'Erro ao importar');$('prog').textContent=''}
  $('bGo').disabled=false;
}
async function clearAll(){
  const db=await idb(),tx=db.transaction('kv','readwrite');tx.objectStore('kv').clear();await txDone(tx);
  await loadIndex();toast('Lista apagada');
}

/* ---------- Navegação ---------- */
async function loadIndex(){
  const idx=(await kvGet('index'))||[];
  S.secs=new Map();
  for(const e of idx){if(!S.secs.has(e.sec))S.secs.set(e.sec,[]);S.secs.get(e.sec).push(e)}
  const has=idx.length>0;
  $('empty').style.display=has?'none':'block';
  $('tabs').style.display=$('chips').style.display=has?'':'none';
  if(!has){$('grid').innerHTML='';$('more').style.display='none';$('info').textContent='';return}
  renderTabs();
  if(!S.secs.has(S.sec))S.sec=S.secs.keys().next().value;
  await selectSec(S.sec);
}
function renderTabs(){
  let h=`<button data-s="__fav" class="${S.sec==='__fav'?'on':''}">⭐ Favoritos</button>`;
  for(const[s,a]of S.secs){
    const n=a.reduce((x,e)=>x+e.c,0);
    h+=`<button data-s="${esc(s)}" class="${S.sec===s?'on':''}">${esc(s)} (${n.toLocaleString('pt-PT')})</button>`;
  }
  $('tabs').innerHTML=h;
}
function renderChips(){
  const a=S.secs.get(S.sec)||[];
  $('chips').innerHTML=a.length>1?a.map(e=>`<button data-g="${esc(e.g)}" class="${S.sub===e.g?'on':''}">${esc(e.sub)} (${e.c})</button>`).join(''):'';
}
async function selectSec(sec){
  S.sid++;S.sec=sec;$('q').value='';renderTabs();
  if(sec==='__fav'){S.sub=null;$('chips').innerHTML='';setItems(S.favs,'Favoritos');return}
  const a=S.secs.get(sec)||[];
  if(a.length)await selectGroup(a[0].g);
}
async function selectGroup(g){
  S.sid++;S.sub=g;renderChips();
  const arr=(await kvGet('g:'+g))||[];
  setItems(arr,'');
}
function setItems(arr,label){
  S.items=arr;S.shown=0;$('grid').innerHTML='';
  $('info').textContent=arr.length?`${label?label+' · ':''}${arr.length.toLocaleString('pt-PT')} itens`:(label==='Favoritos'?'Ainda não tens favoritos. Toca na ☆ de um item.':'Sem resultados');
  showMore();
}
function showMore(){
  const part=S.items.slice(S.shown,S.shown+PAGE);
  $('grid').insertAdjacentHTML('beforeend',part.map((it,k)=>card(it,S.shown+k)).join(''));
  S.shown+=part.length;
  $('more').style.display=S.shown<S.items.length?'block':'none';
}
function card(it,i){
  const fav=S.favs.some(f=>f[2]===it[2]);
  const logo=it[1]?`<img src="${esc(it[1].replace(/^http:/,'https:'))}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:'';
  return `<div class="card" tabindex="0" data-i="${i}" data-l="${esc((it[0].trim()[0]||'?').toUpperCase())}">${logo}<button class="fav" data-f="${i}" aria-label="Favorito">${fav?'⭐':'☆'}</button><div class="meta">${esc(it[0])}</div></div>`;
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Favoritos ---------- */
try{S.favs=JSON.parse(localStorage.getItem('iptv_favs2')||'[]')}catch(e){}
function toggleFav(i){
  const it=S.items[i];if(!it)return;
  const k=S.favs.findIndex(f=>f[2]===it[2]);
  if(k>-1)S.favs.splice(k,1);else S.favs.push(it);
  try{localStorage.setItem('iptv_favs2',JSON.stringify(S.favs))}catch(e){}
  if(S.sec==='__fav'){S.items=S.favs;const n=S.shown;S.shown=0;$('grid').innerHTML='';S.shown=0;const keep=Math.max(n,PAGE);const part=S.items.slice(0,keep);$('grid').innerHTML=part.map((x,j)=>card(x,j)).join('');S.shown=part.length;$('info').textContent=`Favoritos · ${S.items.length}`;$('more').style.display=S.shown<S.items.length?'block':'none'}
  else{const b=document.querySelector(`[data-f="${i}"]`);if(b)b.textContent=k>-1?'☆':'⭐'}
}

/* ---------- Pesquisa global (cursor sobre os grupos) ---------- */
let qt;
$('q').addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(search,350)});
async function search(){
  const q=$('q').value.trim().toLowerCase(),id=++S.sid;
  if(q.length<2){if(!q&&S.sec)selectSec(S.sec);return}
  $('info').textContent='A pesquisar…';
  const res=[],db=await idb(),st=db.transaction('kv').objectStore('kv');
  await new Promise(done=>{
    const rq=st.openCursor(IDBKeyRange.bound('g:','g:\uffff'));
    rq.onerror=()=>done();
    rq.onsuccess=e=>{
      const c=e.target.result;
      if(!c||res.length>=300||id!==S.sid){done();return}
      for(const it of c.value)if(it[0].toLowerCase().includes(q)){res.push(it);if(res.length>=300)break}
      c.continue();
    };
  });
  if(id!==S.sid)return;
  setItems(res,`Resultados para «${q}»`+(res.length>=300?' (primeiros 300)':''));
}

/* ---------- Player ---------- */
const libs={};
const lib=(k,src)=>libs[k]||(libs[k]=new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>{delete libs[k];ko(new Error('lib'))};document.head.appendChild(s)}));
let hls=null,mp=null,cur=null;
const kind=u=>{const p=u.split('?')[0].toLowerCase();return p.endsWith('.m3u8')?'hls':p.endsWith('.ts')?'ts':'file'};
function stop(){
  const v=$('v');
  try{if(hls)hls.destroy();if(mp){mp.pause();mp.unload();mp.detachMediaElement();mp.destroy()}}catch(e){}
  hls=mp=null;v.pause();v.removeAttribute('src');v.load();
}
function fail(){
  if(!cur)return;
  const mixed=location.protocol==='https:'&&cur[2].startsWith('http:');
  $('pe').textContent=mixed
    ?'Este stream é http:// e o navegador bloqueia-o numa página https. Usa «Abrir no VLC».'
    :'Não foi possível reproduzir. O servidor pode estar offline ou o formato não é suportado. Tenta «Abrir no VLC».';
}
async function play(it){
  cur=it;stop();
  $('pt').textContent=it[0];$('pe').textContent='';$('player').classList.add('open');
  const v=$('v'),u=it[2],k=kind(u);
  try{
    if(k==='hls'){
      if(v.canPlayType('application/vnd.apple.mpegurl'))v.src=u;
      else{
        await lib('hls','https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js');
        hls=new Hls();hls.loadSource(u);hls.attachMedia(v);
        hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)fail()});
      }
    }else if(k==='ts'){
      await lib('ts','https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js');
      if(mpegts.getFeatureList().mseLivePlayback){
        mp=mpegts.createPlayer({type:'mpegts',isLive:true,url:u});
        mp.attachMediaElement(v);mp.load();mp.on(mpegts.Events.ERROR,fail);
      }else v.src=u;
    }else v.src=u;
    v.play().catch(()=>{});
  }catch(e){fail()}
}
$('v').addEventListener('error',fail);
function closePlayer(){stop();cur=null;$('player').classList.remove('open')}
$('bClose').onclick=closePlayer;
$('bVlc').onclick=()=>{if(cur)location.href='vlc://'+cur[2]};
$('bOpen').onclick=()=>{if(cur)window.open(cur[2],'_blank','noopener')};
$('bCopy').onclick=async()=>{
  if(!cur)return;
  try{await navigator.clipboard.writeText(cur[2]);toast('Link copiado')}catch(e){prompt('Copia o link:',cur[2])}
};

/* ---------- Eventos ---------- */
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b)selectSec(b.dataset.s)});
$('chips').addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(b)selectGroup(b.dataset.g)});
$('grid').addEventListener('click',e=>{
  const f=e.target.closest('[data-f]');if(f){toggleFav(+f.dataset.f);return}
  const c=e.target.closest('.card');if(c)play(S.items[+c.dataset.i]);
});
$('grid').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('card'))play(S.items[+e.target.dataset.i])});
$('more').onclick=showMore;
const openImp=()=>{$('prog').textContent='';$('imp').classList.add('open')};
$('bImp').onclick=$('bImp2').onclick=openImp;
$('bCancel').onclick=()=>$('imp').classList.remove('open');
$('bGo').onclick=doImport;
$('bClear').onclick=()=>{if(confirm('Apagar a lista guardada neste dispositivo?'))clearAll()};
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape'&&e.key!=='Backspace'&&e.keyCode!==10009)return;
  if($('player').classList.contains('open')){closePlayer();return}
  if(e.key==='Escape')$('imp').classList.remove('open');
});
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),4000)}

/* ---------- Arranque ---------- */
loadIndex().catch(()=>{$('empty').style.display='block'});
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
